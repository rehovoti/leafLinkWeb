events {
  worker_connections 1024;
}

http {
  upstream frontend {
    server frontend:5173;
  }

  upstream backend {
    server backend:8000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://frontend;
    }

    location /api {
      rewrite /api/(.*) /$1 break;
      proxy_pass http://backend;
    }
  }
}